name: Publish game-free Meteos launcher 0.2.1
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-launcher-0.2.1.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify runtime and build game-free launcher
        shell: pwsh
        run: |
          ./scripts/Setup-MeteosRuntime.ps1
          ./scripts/Build-MeteosLauncher.ps1 -OutputPath ./build/public-launcher
      - name: Inspect public ZIP and include runtime sources
        shell: pwsh
        run: |
          python ./scripts/Verify-LauncherArchive.py ./build/public-launcher/MeteosLauncher-0.2.1-preview-windows-x64.zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip='./build/public-launcher/MeteosLauncher-0.2.1-preview-windows-x64.zip'
          $archive=[IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
            $forbidden=@($archive.Entries|Where-Object { $_.FullName -match '(^|/)(game|saves)/|\.log$|bezel\.png$|d3d9\.dll$' })
            if($forbidden.Count){throw 'Public ZIP contains private game data or experimental binaries.'}
            if(!($archive.Entries|Where-Object FullName -match 'MeteosLauncher.exe$')){throw 'Launcher executable missing.'}
          } finally { $archive.Dispose() }
          $source='./build/public-launcher/freej2me-plus-087fe289-source.zip'
          Invoke-WebRequest 'https://codeload.github.com/TASEmulators/freej2me-plus/zip/087fe2899579e1f439655c0fc3444cbc3afeea2e' -OutFile $source
          Get-FileHash $zip,$source -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content ./build/public-launcher/SHA256SUMS.txt
      - name: Publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.1-preview.1 ./build/public-launcher/MeteosLauncher-0.2.1-preview-windows-x64.zip ./build/public-launcher/freej2me-plus-087fe289-source.zip ./build/public-launcher/SHA256SUMS.txt --target $env:GITHUB_SHA --prerelease --title 'Meteos Launcher 0.2.1 — Windows testing preview' --notes-file ./docs/RELEASE-0.2.1.md
